
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banesco Seguros: Expedition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #FFFFFF;
            --foreground: #1A1A1A;
            --card: #FFFFFF;
            --card-foreground: #1A1A1A;
            --primary: #003c71;
            --primary-foreground: #F9FAFB;
            --secondary: #f0f3f5;
            --secondary-foreground: #1D2939;
            --muted: #888888;
            --muted-foreground: #737373;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
        }
        .bg-primary { background-color: var(--primary); }
        .text-primary { color: var(--primary); }
        .text-primary-foreground { color: var(--primary-foreground); }
        .bg-secondary { background-color: var(--secondary); }
        .text-muted-foreground { color: var(--muted-foreground); }
        .border-primary { border-color: var(--primary); }
        .ring-primary { --tw-ring-color: var(--primary); }
        .hidden { display: none; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="antialiased">

    <div id="loading-screen" class="w-full h-screen flex flex-col items-center justify-center bg-background fixed top-0 left-0 z-50">
        <div class="loader"></div>
        <p class="mt-4 text-muted-foreground">Cargando expedición...</p>
    </div>
    
    <div id="auth-error-screen" class="w-full h-screen flex-col items-center justify-center bg-background fixed top-0 left-0 z-50 hidden">
        <h1 class="text-2xl font-bold text-destructive">Acceso Denegado</h1>
        <p id="auth-error-message" class="mt-2 text-muted-foreground text-center max-w-md"></p>
    </div>


    <div id="app" class="min-h-screen flex-col hidden">
        <header class="bg-primary text-primary-foreground">
            <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-24">
                    <div class="flex-shrink-0">
                        <a href="#" class="flex items-center space-x-3 text-white hover:text-white/90 transition-colors">
                            <img src="https://raw.githubusercontent.com/Rduque2025/web-assets-banesco-seguros/main/BANESCO%20LOGO%20BLANCO.png" alt="Banesco Seguros Logo" class="w-5 h-5"/>
                            <span class="font-bold text-xl hidden sm:inline tracking-tighter">CONECTAD2S</span>
                        </a>
                    </div>
                    <div class="hidden md:block">
                        <div id="nav-links" class="ml-10 flex items-baseline space-x-6">
                           <a href="#dashboard" data-page="dashboard" class="nav-link px-3 py-2 rounded-md text-xs transition-colors font-bold text-white">Dashboard</a>
                           <a href="#misiones" data-page="misiones" class="nav-link px-3 py-2 rounded-md text-xs transition-colors font-normal text-white/70 hover:text-white">Misiones</a>
                           <a href="#ranking" data-page="ranking" class="nav-link px-3 py-2 rounded-md text-xs transition-colors font-normal text-white/70 hover:text-white">Ranking</a>
                           <a href="#profile" data-page="profile" class="nav-link px-3 py-2 rounded-md text-xs transition-colors font-normal text-white/70 hover:text-white">Mi Perfil</a>
                        </div>
                    </div>
                    <div id="header-user-info" class="flex items-center gap-4">
                        <!-- User info will be injected here by JS -->
                    </div>
                </div>
            </nav>
        </header>
        
        <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div id="page-container">
                <!-- Page content will be injected here by JS -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // URL del script de Google que obtiene TODOS los datos
            const appsScriptUrl = "https://script.google.com/macros/s/AKfycbxRHVaNZ9AiiVfzG6JQ_0ueYiEmktL9RZlcGOfFgQo6yTIsAY-TKBtbV7lxvsL5rmQ_Mg/exec";

            const appElement = document.getElementById('app');
            const loadingScreen = document.getElementById('loading-screen');
            const authErrorScreen = document.getElementById('auth-error-screen');
            const authErrorMessage = document.getElementById('auth-error-message');
            
            let appData = {};

            // --- DATA FETCHING ---
            async function fetchData() {
                if (!appsScriptUrl || appsScriptUrl.includes("PEGA_TU_URL")) {
                    console.error('La URL de Apps Script no está configurada.');
                    return { error: 'La URL de Apps Script no está configurada.' };
                }
                try {
                    const response = await fetch(appsScriptUrl);
                    if (!response.ok) {
                      const errorText = await response.text();
                      return { error: `Error desde el servidor: ${response.status} ${response.statusText}`, details: errorText };
                    }
                    const data = await response.json();
                    if (data.error) {
                        return { error: data.message };
                    }
                    return data;
                } catch (error) {
                    console.error('Error fetching data from Apps Script:', error);
                    return { error: 'No se pudo conectar con el servicio de datos. Revisa la consola para más detalles.' };
                }
            }

            // --- TEMPLATING / RENDERING ---
            function renderHeader(user) {
                const container = document.getElementById('header-user-info');
                if (!user) {
                    container.innerHTML = '<p class="text-sm text-white/80">No autenticado</p>';
                    return;
                }
                container.innerHTML = `
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-bold text-white">${user.name}</p>
                        <p class="text-xs text-white/80">${user.xp.toLocaleString()} CONECTCOINS</p>
                    </div>
                    <div class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full">
                       <span class="flex h-full w-full items-center justify-center rounded-full bg-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                       </span>
                    </div>`;
            }

            function renderDashboard() {
                 const { currentUser, levels, avatars, tasks, placeholderImages } = appData;
                 if (!currentUser) return '<p>Cargando datos del dashboard...</p>';
                 const userLevel = levels.find(l => l.id === currentUser.level);
                 const levelTasks = tasks.filter(t => t.level === currentUser.level);
                 const currentAvatar = avatars.find(a => a.name === currentUser.avatar);

                 // Avatar Evolution Component
                 const avatarEvolutionHTML = `
                    <div class="w-full">
                        <div class="h-full border-0 shadow-none rounded-lg">
                            <div class="flex flex-col items-center text-center gap-8 pt-6 h-full">
                                <div class="flex-grow flex flex-col md:flex-row items-center justify-center h-96 w-full md:gap-4">
                                    <div class="relative w-48 h-64 md:w-64 md:h-96">
                                        <img src="${currentAvatar.imageUrl}" alt="${currentAvatar.name}" class="object-contain w-full h-full">
                                    </div>
                                    <div class="w-64 text-center md:text-left">
                                        <h3 class="text-base font-semibold">${currentAvatar.name}</h3>
                                        <p class="text-xs text-muted-foreground mt-1">${currentAvatar.description}</p>
                                    </div>
                                </div>
                                <div class="flex items-end justify-center space-x-4 w-full">
                                    ${avatars.map(avatar => `
                                        <button class="flex flex-col items-center text-center">
                                            <div class="relative mb-2">
                                                <div class="w-28 h-28 bg-secondary rounded-lg flex items-center justify-center p-2 transition-all ${currentUser.avatar === avatar.name ? 'ring-2 ring-primary ring-offset-2' : ''} ${avatar.level > currentUser.level ? 'opacity-60' : ''}">
                                                    <img src="${avatar.imageUrl}" alt="${avatar.name}" width="56" height="56" class="object-contain ${avatar.level > currentUser.level ? 'grayscale' : ''}">
                                                </div>
                                            </div>
                                            ${avatar.level <= currentUser.level ? '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-muted"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>'}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                 `;

                 const worldImage = placeholderImages.find(p => p.id === userLevel.worldImageId);
                 const currentWorldHTML = `
                    <div class="w-full">
                         <div class="h-full border-0 shadow-none rounded-lg">
                            <div class="flex flex-col items-center text-center gap-8 pt-6 h-full">
                                <div class="flex-grow flex flex-col md:flex-row items-center justify-center h-96 w-full md:gap-4">
                                     <div class="relative w-80 h-80">
                                         <img src="${worldImage.imageUrl}" alt="${userLevel.worldName}" class="object-contain w-full h-full">
                                     </div>
                                      <div class="w-64 text-center md:text-left">
                                         <h3 class="text-base font-semibold">${userLevel.worldName}</h3>
                                         <p class="text-xs text-muted-foreground mt-1">${userLevel.story}</p>
                                     </div>
                                </div>
                                <div class="flex items-end justify-center space-x-4 w-full">
                                    ${levels.map(level => {
                                        const img = placeholderImages.find(p => p.id === level.worldImageId);
                                        return `
                                        <button class="flex flex-col items-center text-center">
                                            <div class="relative mb-2"><div class="w-28 h-28 bg-secondary rounded-lg flex items-center justify-center p-2 transition-all ${level.id === currentUser.level ? 'ring-2 ring-primary ring-offset-2' : ''} ${level.id > currentUser.level ? 'opacity-60' : ''}"><img src="${img.imageUrl}" alt="${level.worldName}" width="96" height="96" class="object-contain ${level.id > currentUser.level ? 'grayscale' : ''}"></div></div>
                                            ${level.id <= currentUser.level ? '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-muted"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>'}
                                        </button>
                                        `
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                 `;

                const objectivesHTML = `
                     <div class="w-full">
                        <div class="h-full bg-transparent border-0 shadow-none">
                            <div class="px-2">
                                <div class="text-xl font-bold text-foreground">Lista de Misiones</div>
                            </div>
                            <div class="px-2 pt-6">
                                <div class="space-y-3">
                                ${levelTasks.map(task => `
                                    <div class="p-4 shadow-sm cursor-pointer transition-colors bg-card rounded-lg">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <p class="text-sm font-semibold">${task.title}</p>
                                                <p class="text-xs text-muted-foreground">${task.description}</p>
                                            </div>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-green-400 flex-shrink-0 ml-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                        </div>
                                    </div>
                                `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                 return `
                    <div class="flex flex-col gap-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                            ${avatarEvolutionHTML}
                            ${currentWorldHTML}
                        </div>
                        ${objectivesHTML}
                    </div>
                `;
            }

            function renderMisiones() {
                const { tasks } = appData;
                return `
                    <div class="space-y-8">
                        <header>
                            <h1 class="text-4xl font-bold text-foreground">Lista de Misiones</h1>
                            <p class="text-muted text-lg mt-1">Aquí puedes ver todas tus misiones, completadas y pendientes.</p>
                        </header>
                        <div class="space-y-3">
                        ${tasks.map(task => `
                            <div class="p-4 shadow-sm bg-card rounded-lg">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-semibold">${task.title}</p>
                                        <p class="text-xs text-muted-foreground">${task.description}</p>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <span class="text-sm font-bold text-primary">${task.xp} pts</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-green-400 flex-shrink-0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                        </div>
                    </div>`;
            }

            function renderRanking() {
                 const { users, avatars, currentUser, levels } = appData;
                 const sortedUsers = [...users].sort((a, b) => b.xp - a.xp);
                 const myRank = sortedUsers.findIndex(u => u.email === currentUser.email) + 1;
                 const myLevel = levels.find(l => l.id === currentUser.level);
                 const myAvatar = avatars.find(a => a.name === currentUser.avatar);

                 return `
                    <div class="space-y-8">
                        <header>
                            <h1 class="text-4xl font-bold text-foreground">Ranking de la Expedición</h1>
                            <p class="text-muted text-lg mt-1">Mira tu progreso y el de tus compañeros.</p>
                        </header>

                        <div class="sticky top-20 z-10 bg-primary text-primary-foreground shadow-lg rounded-lg">
                            <div class="p-6">
                                <div class="flex items-center">
                                    <div class="font-bold text-lg text-white w-[80px]">#${myRank > 0 ? myRank : '-'}</div>
                                    <div class="flex-grow flex items-center gap-4">
                                        <div class="p-1 bg-white/20 rounded-full w-12 h-12 flex items-center justify-center">
                                            <img src="${myAvatar.imageUrl}" alt="${myAvatar.name}" width="40" height="40" class="object-contain">
                                        </div>
                                        <div>
                                            <p class="font-semibold text-base">${currentUser.name} (Tú)</p>
                                            <p class="text-xs text-primary-foreground/80">${myAvatar.name} • ${currentUser.xp.toLocaleString()} CONECTCOINS</p>
                                        </div>
                                    </div>
                                    <div class="text-center w-48">
                                        <span class="bg-primary text-primary-foreground font-bold text-xs px-3 py-1 rounded-full">${myLevel.worldName}</span>
                                    </div>
                                    <div class="text-right w-48 flex items-baseline justify-end gap-1.5">
                                        <span class="text-2xl font-bold">${currentUser.xp.toLocaleString()}</span>
                                        <span class="text-xs font-normal text-primary-foreground/80">CONECTCOINS</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
                            <div class="p-0">
                                <div class="relative w-full overflow-auto">
                                    <table class="w-full caption-bottom text-sm">
                                        <tbody class="[&_tr:last-child]:border-0">
                                        ${sortedUsers.slice(0, 10).map((user, index) => {
                                            const userLevel = levels.find(l => l.id === user.level);
                                            const userAvatar = avatars.find(a => a.name === user.avatar);
                                            return `
                                            <tr class="border-b transition-colors hover:bg-muted/50 ${user.email === currentUser.email ? 'bg-secondary/50' : ''}">
                                                <td class="p-4 align-middle font-bold text-lg text-muted w-[80px]">#${index + 1}</td>
                                                <td class="p-4 align-middle">
                                                    <div class="flex items-center gap-4">
                                                        <div class="p-1 bg-secondary rounded-full w-12 h-12 flex items-center justify-center"><img src="${userAvatar.imageUrl}" alt="${userAvatar.name}" width="32" height="32" class="object-contain"></div>
                                                        <div>
                                                            <p class="font-semibold text-foreground">${user.name}</p>
                                                            <p class="text-xs text-muted-foreground">${userAvatar.name}</p>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="p-4 align-middle text-center w-48"><span class="bg-primary text-primary-foreground font-bold text-xs px-3 py-1 rounded-full">${userLevel ? userLevel.worldName : ''}</span></td>
                                                <td class="p-4 align-middle text-right w-48"><span class="bg-primary text-primary-foreground font-bold text-xs px-3 py-1 rounded-full">${user.xp.toLocaleString()}</span></td>
                                            </tr>`
                                        }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderProfile() {
                const { currentUser, tasks, avatars, levels } = appData;
                const completedTasksCount = tasks.filter(t => t.status === 'completed').length;
                const currentAvatar = avatars.find(a => a.name === currentUser.avatar);
                const currentLevel = levels.find(l => l.id === currentUser.level);

                return `
                    <div class="space-y-8">
                        <header>
                            <h1 class="text-4xl font-bold text-foreground">Mi Evolución</h1>
                            <p class="text-muted text-lg mt-1">Tu progreso y estadísticas en la expedición.</p>
                        </header>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
                            <div class="md:col-span-1 text-center p-6 flex flex-col items-center justify-start h-full border-0 shadow-none">
                                <div class="relative w-64 h-64 mx-auto mb-4">
                                    <img src="${currentAvatar.imageUrl}" alt="${currentAvatar.name}" class="object-contain" style="position: absolute; height: 100%; width: 100%; inset: 0px;">
                                </div>
                                <div class="mt-2 text-center flex flex-col items-center gap-2">
                                    <span class="bg-primary text-primary-foreground font-bold text-sm px-4 py-1 rounded-full">${currentLevel.worldName}</span>
                                    <span class="bg-primary text-primary-foreground font-bold text-sm px-4 py-1 rounded-full">${currentUser.avatar}</span>
                                </div>
                            </div>
                            <div class="md:col-span-2">
                                <div class="border-0 shadow-none rounded-lg">
                                    <div class="flex flex-col space-y-1.5 p-6">
                                        <div class="text-2xl font-semibold leading-none tracking-tight">Estadísticas</div>
                                        <div class="text-sm text-muted-foreground">Tu resumen de progreso total.</div>
                                    </div>
                                    <div class="p-6 pt-0 grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div class="p-4 bg-secondary/50 border-0 shadow-none rounded-lg">
                                            <p class="text-sm font-semibold text-muted-foreground">Tareas Completadas</p>
                                            <p class="text-3xl font-bold text-primary">${completedTasksCount}</p>
                                        </div>
                                        <div class="p-4 bg-secondary/50 border-0 shadow-none rounded-lg">
                                            <p class="text-sm font-semibold text-muted-foreground">CONECTCOINS</p>
                                            <p class="text-3xl font-bold text-primary">${currentUser.xp.toLocaleString()}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }

            // --- NAVIGATION ---
            const pageRenderers = {
                dashboard: renderDashboard,
                misiones: renderMisiones,
                ranking: renderRanking,
                profile: renderProfile,
            };

            function showPage(pageId) {
                const container = document.getElementById('page-container');
                if (!appData.currentUser && pageId !== 'ranking') {
                    // Si no hay usuario y no estamos en la página de ranking, no hacer nada.
                    // Esto evita errores si intentamos renderizar páginas que dependen del currentUser.
                    return;
                }
                container.innerHTML = pageRenderers[pageId] ? pageRenderers[pageId]() : '<p>Página no encontrada.</p>';

                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.dataset.page === pageId) {
                        link.classList.add('font-bold', 'text-white');
                        link.classList.remove('font-normal', 'text-white/70');
                    } else {
                        link.classList.add('font-normal', 'text-white/70');
                        link.classList.remove('font-bold', 'text-white');
                    }
                });
                window.location.hash = pageId;
            }

            // --- INITIALIZATION ---
            const data = await fetchData();
            
            if (data.error) {
                loadingScreen.classList.add('hidden');
                authErrorScreen.classList.remove('hidden');
                authErrorMessage.textContent = `Error: ${data.error}. Detalles: ${data.details || 'Revisa la consola del navegador y la configuración del script de Google.'}`;
                return;
            }
            
            if (!data.currentUser) {
                 loadingScreen.classList.add('hidden');
                 authErrorScreen.classList.remove('hidden');
                 authErrorMessage.textContent = 'Usuario no autorizado. Tu correo no se encuentra registrado en la hoja de cálculo de la expedición. Contacta al administrador.';
                 return;
            }

            appData = data;
            // Asegurar que las misiones siempre tengan status completed
            appData.tasks = (appData.tasks || []).map(t => ({...t, status: 'completed'}));


            loadingScreen.classList.add('hidden');
            appElement.classList.remove('hidden');
            appElement.classList.add('flex');

            renderHeader(appData.currentUser);

            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    const pageId = this.dataset.page;
                    showPage(pageId);
                });
            });

            const initialPage = window.location.hash.substring(1) || 'dashboard';
            showPage(initialPage);

            window.addEventListener('hashchange', () => {
                const pageId = window.location.hash.substring(1) || 'dashboard';
                showPage(pageId);
            });
            
        });
    </script>

</body>
</html>
