<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 0 0% 10%;
            --card: 0 0% 100%;
            --card-foreground: 0 0% 10%;
            --popover: 0 0% 100%;
            --popover-foreground: 0 0% 10%;
            --primary: 209 100% 22%;
            --primary-foreground: 0 0% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 0 0% 53.3%;
            --muted-foreground: 0 0% 45.1%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 0 0% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 209 100% 22%;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .grayscale { filter: grayscale(100%); }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 50% { opacity: .5; } }
        .chart-progress { transition: stroke-dashoffset 0.5s ease-out; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        primary: {
                            DEFAULT: 'hsl(var(--primary))',
                            foreground: 'hsl(var(--primary-foreground))',
                        },
                        secondary: {
                            DEFAULT: 'hsl(var(--secondary))',
                            foreground: 'hsl(var(--secondary-foreground))',
                        },
                        destructive: {
                            DEFAULT: 'hsl(var(--destructive))',
                            foreground: 'hsl(var(--destructive-foreground))',
                        },
                        muted: {
                            DEFAULT: 'hsl(var(--muted))',
                            foreground: 'hsl(var(--muted-foreground))',
                        },
                        accent: {
                            DEFAULT: 'hsl(var(--accent))',
                            foreground: 'hsl(var(--accent-foreground))',
                        },
                        popover: {
                            DEFAULT: 'hsl(var(--popover))',
                            foreground: 'hsl(var(--popover-foreground))',
                        },
                        card: {
                            DEFAULT: 'hsl(var(--card))',
                            foreground: 'hsl(var(--card-foreground))',
                        },
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

    function renderRanking(rankingUsers) {
        const pageContainer = document.getElementById('page-container');

        const competingUsers = rankingUsers.filter(user => user.cargo !== 'ADMINISTRADOR');

        const vicepresidencias = ['Todas', ...Array.from(new Set(competingUsers.map(user => user.vicepresidencia).filter(Boolean)))];
        
        let selectedVp = 'Todas';
        if (currentUser?.cargo !== 'ADMINISTRADOR' && currentUser?.vicepresidencia) {
          selectedVp = currentUser.vicepresidencia;
        }

        const getDisplayedUsers = () => {
            if (!currentUser) return [];
            if (currentUser.cargo === 'ADMINISTRADOR') {
                if (selectedVp === 'Todas') return competingUsers;
                return competingUsers.filter(user => user.vicepresidencia === selectedVp);
            }
            return competingUsers.filter(user => user.vicepresidencia === currentUser.vicepresidencia);

    function renderCarEvolution(container) {
        if (!container) return;
        const currentUser = state.currentUser;
        const isAdministrator = currentUser.cargo === 'ADMINISTRATOR';
        const categoryOrder = { 'Base': 0, 'Bronce': 1, 'Plata': 2, 'Oro': 3 };
        const userCategory = toTitleCase(currentUser.avatar);
        const userCategoryRank = isAdministrator ? 3 : (categoryOrder[userCategory] ?? 0);

        const getCurrentEvolution = () => {
            if (isAdministrator) return carEvolutions.find(e => e.category === 'Oro') || carEvolutions[carEvolutions.length - 1];
            const unlockedEvolutions = carEvolutions.filter(e => categoryOrder[e.category] <= userCategoryRank);
            return unlockedEvolutions.sort((a, b) => categoryOrder[b.category] - categoryOrder[a.category])[0] || carEvolutions[0];
        };

        let selectedEvolution = getCurrentEvolution();
        
        const renderContent = () => {
            if (!container) return;
            const isSelectedEvolutionUnlocked = selectedEvolution && categoryOrder[selectedEvolution.category] <= userCategoryRank;
            
            const categoryClasses = {
                'Oro': 'bg-yellow-500',
                'Plata': 'bg-gray-400',
                'Bronce': 'bg-amber-700',
                'Base': 'bg-gray-500',
            };

            container.innerHTML = `
             <div class="rounded-lg border bg-card text-card-foreground shadow-sm h-full border-0 shadow-none">
                <div class="flex flex-col items-center text-center gap-8 pt-6 h-full">
                    <div class="flex-grow flex flex-col md:flex-row items-center justify-center h-96 w-full md:gap-4">
                        <div class="relative w-80 h-80">
                            <img src="${selectedEvolution.imageUrl}" alt="${selectedEvolution.name}" class="w-full h-full object-contain ${!isSelectedEvolutionUnlocked ? 'grayscale' : ''}">
                        </div>
                        <div class="w-64 text-center md:text-left">
                            <span class="text-xs font-bold px-3 py-1 rounded-full text-white ${categoryClasses[selectedEvolution.category] || 'bg-gray-500'}">
                                ${selectedEvolution.category}
                            </span>
                            <h3 class="text-base font-semibold mt-2">${selectedEvolution.name}</h3>
                            <p class="text-xs text-muted-foreground mt-1 whitespace-pre-line">${selectedEvolution.description}</p>
                        </div>
                    </div>
                    
                    ${!isAdministrator ? `
                    <div class="w-full max-w-sm px-4">
                        <div class="relative h-2 w-full overflow-hidden rounded-full bg-secondary">
                            <div class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(-${100 - (currentUser.progreso || 0)}%);"></div>
                        </div>
                        <p class="text-xs text-muted-foreground mt-2 whitespace-nowrap">Llevas un ${(currentUser.progreso || 0).toFixed(2)}% de logro.</p>
                    </div>
                    ` : ''}

                    <div class="flex items-end justify-center space-x-4 w-full">
                        ${carEvolutions.map(evolution => {
                            const isUnlocked = categoryOrder[evolution.category] <= userCategoryRank;
                            const isSelected = selectedEvolution?.id === evolution.id;
                            return `
                                <button data-evolution-id="${evolution.id}" class="evolution-btn flex flex-col items-center text-center transition-all duration-300 ${isSelected ? 'scale-110' : 'scale-100 opacity-50 hover:opacity-75'}">
                                    <div class="relative mb-2 w-24 h-24 bg-secondary rounded-lg flex items-center justify-center p-2 transition-all ${isSelected ? 'border-2 border-primary' : 'border-2 border-transparent'}">
                                        <img src="${evolution.imageUrl}" alt="${evolution.name}" width="80" height="80" class="object-contain ${!isUnlocked ? 'grayscale' : ''}">
                                        ${!isUnlocked ? `<div class="absolute inset-0 bg-black/30 rounded-lg flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-white/70"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>` 
                                        : `<div class="absolute top-1 right-1 bg-green-500 rounded-full p-0.5"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 text-white"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`}
                                    </div>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>`;
            
            container.querySelectorAll('.evolution-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.evolutionId);
                    selectedEvolution = carEvolutions.find(e => e.id === id);
                    renderContent();
                });
            });
        };
        
        renderContent();
    }
    
    function toTitleCase(str) {
      if (!str) return '';
      return str.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
    }

    function renderCurrentWorld(container) {
        if (!container) return;
        const currentUser = state.currentUser;
        const isAdministrator = currentUser.cargo === 'ADMINISTRADOR';
        const vpKeys = Object.keys(vicepresidenciaMessages);

        const getVpKeyFromName = (name) => {
            if (!name) return null;
            const lowerName = name.toLowerCase();
            if (lowerName.includes('gran caracas')) return 'gran-caracas';
            if (lowerName.includes('ctro. occid') || lowerName.includes('andes')) return 'centro-occidente-andes';
            if (lowerName.includes('centro llanos') || lowerName.includes('carabobo')) return 'centro-llanos-carabobo';
            if (lowerName.includes('oriente')) return 'oriente';
            if (lowerName.includes('zulia') || lowerName.includes('falcón')) return 'zulia-falcon';
            return null;
        };

        const initialVpKey = getVpKeyFromName(currentUser.vicepresidencia || '') || vpKeys[0];
        let selectedVpKey = initialVpKey;
        
        const renderContent = () => {
            if (!container) return;
            const displayVpKey = isAdministrator ? selectedVpKey : getVpKeyFromName(currentUser.vicepresidencia || '');
            const vpDetails = vpKeys.includes(displayVpKey) ? vicepresidenciaMessages[displayVpKey] : null;

            const welcomeMessage = vpDetails?.message || "Bienvenido al Circuito Banesco.";
            const worldImageId = vpDetails?.worldImageId;
            const worldImage = placeholderImages.find(p => p.id === worldImageId);
            const worldName = vpDetails?.name || currentUser.vicepresidencia || "Pista General";

            let selectorHTML = '';
            if (isAdministrator) {
                selectorHTML = `
                <div class="flex items-end justify-center space-x-2 w-full overflow-x-auto pb-2 min-h-[114px]">
                    ${vpKeys.map(vpKey => {
                        const vpData = vicepresidenciaMessages[vpKey];
                        const image = vpData ? placeholderImages.find(p => p.id === vpData.worldImageId) : null;
                        const isSelected = selectedVpKey === vpKey;
                        return `
                        <button data-vp-key="${vpKey}" class="vp-selector-btn flex flex-col items-center text-center transition-all duration-300 flex-shrink-0 ${isSelected ? 'scale-105' : 'scale-100 opacity-60 hover:opacity-100'}">
                            <div class="relative mb-2 w-24 h-24 bg-secondary rounded-lg flex items-center justify-center p-2 transition-all ${isSelected ? 'border-2 border-primary' : 'border-2 border-transparent'}">
                                ${image ? `<img src="${image.imageUrl}" alt="${vpData.name}" width="80" height="80" class="object-contain">` : `<div class="w-full h-full bg-gray-300 rounded-md"></div>`}
                            </div>
                        </button>
                        `;
                    }).join('')}
                </div>
                `;
            }

            container.innerHTML = `
            <div class="rounded-lg border bg-card text-card-foreground shadow-sm h-full border-0 shadow-none">
                <div class="flex flex-col items-center text-center gap-8 pt-6 h-full">
                    <div class="flex-grow flex flex-col md:flex-row items-center justify-center h-96 w-full md:gap-4">
                        <div class="relative w-80 h-80">
                            ${worldImage ? `<img src="${worldImage.imageUrl}" alt="${worldName}" class="w-full h-full object-contain">` : `<div class="w-full h-full bg-gray-200 rounded-lg flex items-center justify-center text-muted-foreground">Imagen no disponible</div>`}
                        </div>
                        <div class="w-64 text-center md:text-left">
                           <h3 class="text-base font-semibold">${worldName}</h3>
                           <p class="text-xs text-muted-foreground mt-1 whitespace-pre-line">${welcomeMessage}</p>
                        </div>
                    </div>
                    ${selectorHTML}
                </div>
            </div>`;

            if (isAdministrator) {
                container.querySelectorAll('.vp-selector-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedVpKey = btn.dataset.vpKey;
                        renderContent();
                    })
                })
            }
        }
        renderContent();
    }
    
    // --- Chart Renderers ---
    function renderAreaChart(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <svg viewBox="0 0 400 200" class="w-full h-full">
                <defs>
                    <linearGradient id="colorUv" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stop-color="hsl(var(--primary))" stop-opacity="0.4"/>
                        <stop offset="95%" stop-color="hsl(var(--primary))" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <path d="M 0 120 C 100 150, 200 80, 300 100 L 400 60 L 400 200 L 0 200 Z" fill="url(#colorUv)" />
                <path d="M 0 120 C 100 150, 200 80, 300 100 L 400 60" stroke="hsl(var(--primary))" stroke-width="2" fill="none" />
            </svg>
        `;
    }

    function renderPieChart(containerId, value, name) {
        const container = document.getElementById(containerId);
        const radius = 40;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - (value / 100) * circumference;

        container.innerHTML = `
            <h4 class="font-semibold text-foreground text-sm mb-2">${name}</h4>
            <div class="w-32 h-32 relative">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="hsl(var(--border))" stroke-width="12"></circle>
                    <circle class="chart-progress" cx="50" cy="50" r="${radius}" fill="transparent" stroke="hsl(var(--primary))" stroke-width="12" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 50 50)" stroke-linecap="round"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-3xl font-bold text-primary tracking-tight">${value}</span>
                </div>
            </div>`;
    }


    // --- HELPERS & API ---

    async function handleApiCall(url, payload) {
        try {
            const response = await fetch(url, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' },
            });
            const text = await response.text();
            try {
                const data = JSON.parse(text);
                 if (data.error && data.message) {
                    throw new Error(data.message);
                }
                return data;
            } catch (e) {
                // This can happen if Apps Script returns an HTML error page.
                console.error("Failed to parse JSON, raw response:", text);
                throw new Error("Respuesta inválida del servidor. Revisa los logs de Apps Script.");
            }
        } catch (error) {
            console.error('Error en handleApiCall:', error);
            throw error; // Re-throw the error to be caught by the caller
        }
    }


    async function handleLogin(event) {
        event.preventDefault();
        const form = event.target;
        const button = document.getElementById('login-button');
        const errorContainer = document.getElementById('login-error');
        
        button.disabled = true;
        button.textContent = 'Iniciando Sesión...';
        errorContainer.classList.add('hidden');

        try {
            const data = await handleApiCall(APPS_SCRIPT_URL, {
                action: 'login',
                username: form.username.value,
                password: form.cedula.value, // Using cedula as password
            });
            
            const user = {
                id: data.user.id,
                name: data.user.name,
                level: 1, // Static level
                xp: data.user.xp || 0,
                avatar: data.user.avatar || 'Bronce',
                progreso: data.user.progreso || 0,
                vicepresidencia: data.user.vicepresidencia || '',
                posicion: data.user.posicion || 0,
                cargo: data.user.cargo || '',
            };

            localStorage.setItem('currentUser', JSON.stringify(user));
            state.currentUser = user;
            window.location.hash = 'inicio';
            renderMainLayout('inicio');

        } catch (err) {
            errorContainer.textContent = err.message || "Credenciales incorrectas.";
            errorContainer.classList.remove('hidden');
        } finally {
            button.disabled = false;
            button.textContent = 'Entrar a la Carrera';
        }
    }
    
    function handleLogout() {
        localStorage.removeItem('currentUser');
        state.currentUser = null;
        window.location.hash = 'login';
        renderLoginPage();
    }
    
    function navigate(page) {
        window.location.hash = page;
        const links = state.currentUser?.cargo === 'ADMINISTRADOR' ? adminNavLinksData : navLinksData;
        document.querySelectorAll('.nav-link').forEach(link => {
            const isCurrentPage = link.dataset.page === page;
            link.classList.toggle('font-bold', isCurrentPage);
            link.classList.toggle('text-white', isCurrentPage);
            link.classList.toggle('font-normal', !isCurrentPage);
            link.classList.toggle('text-white/70', !isCurrentPage);
            link.classList.toggle('hover:text-white', !isCurrentPage);
        });
        
        const pageContainer = document.getElementById('page-container');
        renderLoading(pageContainer);
        
        // Fetch data if needed and then render
        if (page === 'ranking' || page === 'estadisticas') {
             handleApiCall(APPS_SCRIPT_URL, { action: 'getData' })
                .then(data => {
                    state.users = (data.users || []).map(u => ({
                        id: u.id, name: u.name, level: 1, xp: u.xp || 0, avatar: u.avatar || 'Bronce', progreso: u.progreso || 0, vicepresidencia: u.vicepresidencia || '', posicion: u.posicion || 0, cargo: u.cargo || '',
                    }));
                    if(page === 'ranking') renderRanking(state.users);
                    if(page === 'estadisticas') renderEstadisticasPage();
                })
                .catch(err => {
                     pageContainer.innerHTML = `<p class="text-destructive text-center">Error al cargar datos: ${err.message}</p>`;
                });
        } else {
             switch(page) {
                case 'inicio': renderInicioPage(); break;
                case 'dashboard': renderDashboard(); break;
                case 'cajero': renderCajeroPage(); break;
                default: renderInicioPage(); break;
            }
        }
    }

    function handleNavClick(event) {
        const link = event.target.closest('a');
        if (link && link.dataset.page) {
            event.preventDefault();
            navigate(link.dataset.page);
        }
    }
    
    function showRulesModal() {
        let rulesHTML = rules.map(rule => `
            <div class="flex items-start gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-primary flex-shrink-0 mt-1"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
                <p class="text-sm text-muted-foreground">${rule}</p>
            </div>
        `).join('');

        openDialog(`
            <div class="flex flex-col space-y-1.5 p-6">
                <h2 class="text-2xl font-bold">Reglas de Participación</h2>
                <p class="text-sm text-muted-foreground">Asegúrate de cumplir con todos los requisitos para ser el próximo campeón del circuito.</p>
            </div>
            <div class="p-6 pt-0 mt-4 space-y-4 max-h-[60vh] overflow-y-auto">
                ${rulesHTML}
            </div>
        `);
    }

    window.showPrizeModal = (prizeId) => {
        const details = prizeDetails[prizeId];
        if (!details) return;
        openDialog(`
            <div class="p-10 overflow-hidden flex flex-col justify-between min-h-[580px]">
                <div class="space-y-4">
                    <h2 class="text-6xl font-black tracking-tighter text-white">${details.title}</h2>
                    <div class="text-white/80 text-base">${details.description}</div>
                </div>
                ${details.images}
            </div>
        `, 'sm:max-w-[625px] bg-primary text-primary-foreground border-0');
    }

    // --- INITIALIZATION ---
    renderApp();
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (state.currentUser) {
            navigate(hash || 'inicio');
        } else {
            renderApp();
        }
    });
});
</script>
