        :root {
            --background: 0 0% 100%; /* #FFFFFF */
            --foreground: 0 0% 10%; /* #1A1A1A */
            --card: 0 0% 100%;
            --card-foreground: 0 0% 10%;
            --popover: 0 0% 100%;
            --popover-foreground: 0 0% 10%;
            --primary: 209 100% 22%; /* #003c71 */
            --primary-foreground: 0 0% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 0 0% 53.3%; /* #888888 */
            --muted-foreground: 0 0% 45.1%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 0 0% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 209 100% 22%;
            --radius: 0.5rem;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .grayscale { filter: grayscale(100%); }
        .ring-primary { --tw-ring-color: hsl(var(--primary)); }
        .ring-2 {
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }
        .ring-offset-2 { --tw-ring-offset-width: 2px; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 50% { opacity: .5; } }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        primary: {
                            DEFAULT: 'hsl(var(--primary))',
                            foreground: 'hsl(var(--primary-foreground))',

                        accent: {

                        },
                        popover: {
                            DEFAULT: 'hsl(var(--popover))',
                            foreground: 'hsl(var(--popover-foreground))',
                        },
                        card: {
                            DEFAULT: 'hsl(var(--card))',
                            foreground: 'hsl(var(--card-foreground))',
                        },
                    }
                }
            }
        }

                <div class="w-full">
                    <div class="h-full bg-transparent border-0 shadow-none">
                        <div class="px-2">
                            <h2 class="text-xl font-bold text-foreground">Lista de Misiones</h2>
                        </div>
                        <div class="px-2 pt-6">
                            <div id="missions-list" class="space-y-3">
                                ${levelTasks.map(task => `
                                    <div class="p-4 shadow-sm cursor-pointer transition-colors rounded-lg bg-card border">
                                        <div class="flex items-center justify-between">

                                                <p class="text-sm font-semibold">${task.title}</p>

                                                : `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-amber-500 flex-shrink-0 ml-4"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4" fill="currentColor"></circle></svg>`

                                        </div>
                                    </div>`).join('')}

                        </div>
                    </div>
                </div>
            </div>`;
        setupDashboardFilters();
    }
    
    function renderRanking(rankingUsers) {

        pageContainer.innerHTML = `
            <div class="space-y-8">
                <header>
                    <h1 class="text-4xl font-bold text-foreground">Ranking de la Expedición</h1>
                    <p class="text-lg mt-1 text-muted">Mira tu progreso y el de tus compañeros.</p>
                </header>
                <div class="sticky top-24 z-10 rounded-lg shadow-lg bg-primary text-primary-foreground">
                    <div class="p-6">
                        <div class="flex items-center">
                            <div class="font-bold text-lg text-white w-[80px]">#${myRank > 0 ? myRank : '-'}</div>
                            <div class="flex-grow flex items-center gap-4">
                                <div class="p-1 bg-white/20 rounded-full w-12 h-12 flex items-center justify-center">
                                    ${myAvatar ? `<img src="${myAvatar.imageUrl}" alt="${currentUser.avatar}" width="40" height="40" class="object-contain">` : ''}
                                </div>
                                <div>
                                    <p class="font-semibold text-base">${currentUser.name} (Tú)</p>
                                    <p class="text-xs text-primary-foreground/80">${currentUser.avatar}</p>
                                </div>
                            </div>
                            <div class="text-center w-48">${myLevel ? `<span class="bg-primary text-primary-foreground font-bold text-xs px-3 py-1 rounded-full">${myLevel.worldName}</span>` : ''}</div>
                            <div class="text-right w-48 flex items-baseline justify-end gap-1.5">
                                <span class="text-2xl font-bold">${currentUser.xp.toLocaleString()}</span>
                                <span class="text-xs font-normal text-primary-foreground/80">CONECTCOINS</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="rounded-lg border bg-card">
                    <div class="relative w-full overflow-auto">
                        <table class="w-full caption-bottom text-sm">
                            <tbody>
                                ${sortedUsers.slice(0, 10).map((user, index) => {
                                    const userLevel = levels.find(l => l.id === user.level);
                                    const userAvatar = avatars.find(av => av.name === user.avatar);
                                    return `<tr class="border-b transition-colors hover:bg-muted/50">
                                                <td class="p-4 align-middle font-bold text-lg w-[80px] text-muted">#${index + 1}</td>
                                                <td class="p-4 align-middle">
                                                    <div class="flex items-center gap-4">
                                                        <div class="p-1 rounded-full w-12 h-12 flex items-center justify-center bg-secondary">
                                                            ${userAvatar ? `<img src="${userAvatar.imageUrl}" alt="${user.avatar}" width="32" height="32" class="object-contain">` : ''}
                                                        </div>
                                                        <div>
                                                            <p class="font-semibold text-foreground">${user.name}</p>
                                                            <p class="text-xs text-muted-foreground">${user.avatar}</p>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="p-4 align-middle text-center w-48">${userLevel ? `<span class="bg-primary text-primary-foreground font-bold text-xs px-3 py-1 rounded-full">${userLevel.worldName}</span>` : ''}</td>
                                                <td class="p-4 align-middle text-right w-48">
                                                    <span class="bg-primary text-primary-foreground font-bold text-xs px-3 py-1 rounded-full">${user.xp.toLocaleString()}</span>
                                                </td>
                                            </tr>`
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
    }

    function renderRankingLoading() {
        const pageContainer = document.getElementById('page-container');
        pageContainer.innerHTML = `<div class="space-y-8 animate-pulse">
                <header><div class="h-10 w-3/4 rounded-md bg-muted"></div><div class="h-6 w-1/2 rounded-md mt-2 bg-muted"></div></header>
                <div class="rounded-lg shadow-lg bg-muted"><div class="p-6 h-24"></div></div>
                <div class="rounded-lg border bg-card"><div class="p-4 space-y-4">
                    ${[...Array(5)].map(() => `<div class="flex items-center space-x-4"><div class="h-12 w-12 rounded-full bg-muted"></div><div class="flex-1 space-y-2"><div class="h-4 w-3/4 rounded bg-muted"></div><div class="h-4 w-1/2 rounded bg-muted"></div></div></div>`).join('')}
                </div></div></div>`;
    }
    
    function renderMisionesPage() {
        document.getElementById('page-container').innerHTML = `
            <div class="flex flex-col items-center text-center">
              <img
                src="https://github.com/Rduque2025/web-assets-banesco-seguros/blob/main/Gemini_Generated_Image_lwc97dlwc97dlwc9-Photoroom.png?raw=true"
                alt="Sección en construcción"
                width="500"
                height="500"
                class="object-contain"
              />
              <h1 class="text-3xl font-bold text-foreground mt-8">
                ¡Esta sección se está forjando!
              </h1>
              <p class="text-sm text-muted-foreground mt-2 max-w-md">
                Nuestros mejores exploradores están preparando misiones emocionantes para ti. ¡Vuelve pronto para descubrir los próximos desafíos!
              </p>
            </div>`;
    }

    function renderError(container, message) {
        container.textContent = message;
        container.classList.remove('hidden');
    }

    // --- EVENT HANDLERS & LOGIC ---

    async function handleApiCall(payload) {
        try {
            const response = await fetch(SPREADSHEET_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload),
                redirect: 'follow',
                mode: 'cors'
            });

            if (!response.ok) {
                 const errorText = await response.text();
                 throw new Error(`Error en la respuesta del servidor: ${errorText}`);
            }
            
            const data = await response.json();

            if (data.error) {
                throw new Error(data.message || 'Error desconocido del script.');
            }
            return data;
        } catch (error) {
            console.error('Error en handleApiCall:', error);
            throw error;
        }
    }

    async function handleLogin(event) {
        event.preventDefault();
        const form = event.target;
        const button = document.getElementById('login-button');
        const errorContainer = document.getElementById('login-error');
        
        button.disabled = true;
        button.textContent = 'Iniciando Sesión...';
        errorContainer.classList.add('hidden');

        try {
            const data = await handleApiCall({
                action: 'login',
                email: form.email.value,
                password: form.password.value
            });
            
            const user = { 
                id: data.user.id,
                name: data.user.name,
                email: data.user.email,
                level: Number(data.user.level) || 1, 
                xp: Number(data.user.xp) || 0,
                avatar: data.user.avatar || 'Explorador'
            };

            localStorage.setItem('currentUser', JSON.stringify(user));
            state.currentUser = user;
            window.location.hash = 'inicio';
            renderMainLayout('inicio');

        } catch (err) {
            renderError(errorContainer, "Error al iniciar sesión: " + err.message);
        } finally {
            button.disabled = false;
            button.textContent = 'Iniciar Sesión';
        }
    }
    
    async function handleRegister(event) {
        event.preventDefault();
        const form = event.target;
        const button = document.getElementById('register-button');
        const errorContainer = document.getElementById('register-error');
        const successContainer = document.getElementById('register-success');
        
        button.disabled = true;
        button.textContent = 'Creando cuenta...';
        errorContainer.classList.add('hidden');
        successContainer.classList.add('hidden');

        try {
            await handleApiCall({
                action: 'register',
                name: form.name.value,
                email: form.email.value,
                password: form.password.value
            });
            
            successContainer.textContent = "¡Registro exitoso! Ahora puedes iniciar sesión.";
            successContainer.classList.remove('hidden');
            form.reset();
            setTimeout(() => {
                window.location.hash = 'login';
                renderLoginPage();
            }, 2000);

        } catch (err) {
            renderError(errorContainer, "Error en el registro: " + err.message);
        } finally {
            button.disabled = false;
            button.textContent = 'Crear Cuenta';
        }
    }

    function handleLogout() {
        localStorage.removeItem('currentUser');
        state.currentUser = null;
        window.location.hash = 'login';
        renderLoginPage();
    }
    
    function navigate(page) {
        window.location.hash = page;
        document.querySelectorAll('.nav-link').forEach(link => {
            const isCurrentPage = link.dataset.page === page;
            link.classList.toggle('font-bold', isCurrentPage);
            link.classList.toggle('text-white', isCurrentPage);
            link.classList.toggle('font-normal', !isCurrentPage);
            link.classList.toggle('text-white/70', !isCurrentPage);
            link.classList.toggle('hover:text-white', !isCurrentPage);
        });
        
        switch(page) {
            case 'inicio': renderInicioPage(); break;
            case 'dashboard': renderDashboard(); break;
            case 'misiones': renderMisionesPage(); break;
            case 'ranking': 
                renderRankingLoading();
                handleApiCall({ action: 'getData' })
                    .then(data => {
                        const allUsers = (data.users || []).map(u => ({ 
                            id: u.correo, 
                            name: u.nombre, 
                            email: u.correo, 
                            level: Number(u.nivel) || 1, 
                            xp: Number(u.puntaje) || 0, 
                            avatar: u.avatar || 'Explorador' 
                        }));
                        renderRanking(allUsers);
                    })
                    .catch(err => {
                         console.error('Ranking fetch error:', err);
                         document.getElementById('page-container').innerHTML = `<p class="text-destructive">Error al cargar el ranking: ${err.message}</p>`;
                    });
                break;
            default: renderInicioPage(); break;
        }
    }

    function handleNavClick(event) {
        const link = event.target.closest('a');
        if (link && link.dataset.page) {
            event.preventDefault();
            const page = link.dataset.page;
            navigate(page);
        }
    }

    function setupDashboardFilters() {
        const avatarSelector = document.getElementById('avatar-selector');
        const selectedAvatarImageContainer = document.getElementById('selected-avatar-image-container');
        const selectedAvatarInfo = document.getElementById('selected-avatar-info');
        const levelSelector = document.getElementById('level-selector');
        const selectedLevelImageContainer = document.getElementById('selected-level-image-container');
        const selectedLevelInfo = document.getElementById('selected-level-info');
        const currentUser = state.currentUser;

        let selectedAvatarId = avatars.find(a => a.name === currentUser.avatar)?.id || 1;
        let selectedLevelId = currentUser.level || 1;

        const updateSelectedAvatar = () => {
            const avatar = avatars.find(a => a.id === selectedAvatarId);
            if (!avatar) return;
            const isUnlocked = avatar.level <= currentUser.level;
            selectedAvatarImageContainer.innerHTML = `<img src="${avatar.imageUrl}" alt="${avatar.name}" class="object-contain absolute inset-0 w-full h-full ${!isUnlocked ? 'grayscale' : ''}">`;
            selectedAvatarInfo.innerHTML = `<h3 class="text-base font-semibold">${avatar.name}</h3><p class="text-xs mt-1 text-muted-foreground">${avatar.description}</p>`;
            selectedAvatarInfo.classList.toggle('opacity-50', !isUnlocked);
            
            // Update selector styles
            document.querySelectorAll('#avatar-selector button').forEach(btn => {
                const isSelected = parseInt(btn.dataset.avatarId) === selectedAvatarId;
                const ringDiv = btn.querySelector('.ring-host');
                if (ringDiv) ringDiv.classList.toggle('ring-2', isSelected);
                if (ringDiv) ringDiv.classList.toggle('ring-primary', isSelected);
                if (ringDiv) ringDiv.classList.toggle('ring-offset-2', isSelected);
            });
        };

        const renderAvatars = () => {
            avatarSelector.innerHTML = '';
            avatars.forEach(avatar => {
                const button = document.createElement('button');
                button.className = 'flex flex-col items-center text-center';
                button.dataset.avatarId = avatar.id;
                button.onclick = () => { selectedAvatarId = avatar.id; updateSelectedAvatar(); };
                const isUnlocked = avatar.level <= currentUser.level;
                const icon = isUnlocked
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-muted"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
                button.innerHTML = `<div class="relative mb-2"><div class="ring-host w-28 h-28 bg-secondary rounded-lg flex items-center justify-center p-2 transition-all ${!isUnlocked ? 'opacity-60' : ''}"><img src="${avatar.imageUrl}" alt="${avatar.name}" width="56" height="56" class="object-contain ${!isUnlocked ? 'grayscale' : ''}"></div></div>${icon}`;
                avatarSelector.appendChild(button);
            });
        };

        const updateSelectedLevel = () => {
            const level = levels.find(l => l.id === selectedLevelId);
            if (!level) return;
            const worldImage = placeholderImages.find(p => p.id === level.worldImageId);
            const isUnlocked = level.id <= currentUser.level;
            selectedLevelImageContainer.innerHTML = `<img src="${worldImage.imageUrl}" alt="${level.worldName}" class="object-contain absolute inset-0 w-full h-full ${!isUnlocked ? 'grayscale' : ''}">`;
            selectedLevelInfo.innerHTML = `<h3 class="text-base font-semibold">${level.worldName}</h3><p class="text-xs mt-1 text-muted-foreground">${level.story}</p>`;
            selectedLevelInfo.classList.toggle('opacity-50', !isUnlocked);

             // Update selector styles
            document.querySelectorAll('#level-selector button').forEach(btn => {
                const isSelected = parseInt(btn.dataset.levelId) === selectedLevelId;
                 const ringDiv = btn.querySelector('.ring-host');
                if (ringDiv) ringDiv.classList.toggle('ring-2', isSelected);
                if (ringDiv) ringDiv.classList.toggle('ring-primary', isSelected);
                if (ringDiv) ringDiv.classList.toggle('ring-offset-2', isSelected);
            });
        };
        
        const renderLevels = () => {
            levelSelector.innerHTML = '';
            levels.forEach(level => {
                 const button = document.createElement('button');
                 button.className = 'flex flex-col items-center text-center';
                 button.dataset.levelId = level.id;
                 button.onclick = () => { selectedLevelId = level.id; updateSelectedLevel(); };
                 const isUnlocked = level.id <= currentUser.level;
                 const worldImage = placeholderImages.find(p => p.id === level.worldImageId);
                 const icon = isUnlocked
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-muted"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
                 button.innerHTML = `<div class="relative mb-2"><div class="ring-host w-28 h-28 bg-secondary rounded-lg flex items-center justify-center p-2 transition-all ${!isUnlocked ? 'opacity-60' : ''}"><img src="${worldImage.imageUrl}" alt="${level.worldName}" width="96" height="96" class="object-contain ${!isUnlocked ? 'grayscale' : ''}"></div></div>${icon}`;
                 levelSelector.appendChild(button);
            });
        };

        renderAvatars();
        updateSelectedAvatar();
        renderLevels();
        updateSelectedLevel();
    }

    // --- INITIALIZATION ---
    renderApp();
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (state.currentUser) {
            if (navLinksData.some(l => l.href === `#${hash}`)) {
                 navigate(hash);
            } else {
                 navigate('inicio');
            }
        } else {
            renderApp(); // Reruns auth check for login/register
        }
    });
});
</script>
